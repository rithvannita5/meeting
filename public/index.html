<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Screen Share App</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #18191a; color: white; padding: 20px; }
    .card { background: #242526; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); width: 95%; max-width: 450px; text-align: center; margin-bottom: 20px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #3a3b3c; border-radius: 6px; background: #3a3b3c; color: white; font-size: 15px; }
    button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: bold; font-size: 14px; }
    button:hover { background: #0056b3; }
    .hidden { display: none; }
    #room-container { width: 95%; max-width: 1400px; text-align: center; }
    .controls { margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 15px; }
    .video-box { background: #242526; padding: 15px; border-radius: 12px; min-height: 300px; }
    video { width: 100%; height: 280px; background: #000; border-radius: 8px; object-fit: contain; cursor: pointer; border: 2px solid #3a3b3c; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    .btn-warning { background: #ffc107; color: #000; }
    .btn-secondary { background: #6c757d; }
    .screen-share-active { background: #ffc107 !important; color: #000 !important; }
    .admin-panel { border-top: 1px solid #444; margin-top: 15px; padding-top: 15px; }
    .room-item { display: flex; justify-content: space-between; align-items: center; background: #3a3b3c; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
    .badge-live { background: #28a745; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    
    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #444; }
    th { background: #3a3b3c; }
    .action-btn { padding: 4px 8px; font-size: 11px; margin: 2px; }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div id="auth" class="card">
    <h2>🔐 ចូលប្រើប្រាស់</h2>
    <input type="text" id="username" placeholder="ឈ្មោះគណនី (Username)" required />
    <input type="password" id="password" placeholder="លេខសម្ងាត់ (Password)" required />
    
    <label style="display:block; text-align:left; margin-top:10px; font-size:14px;">ជ្រើសរើសបន្ទប់៖</label>
    <select id="roomSelect"></select>
    
    <button onclick="login()" style="width: 100%; margin-top: 15px;">ចូលរួមបន្ទប់</button>
  </div>

  <!-- Admin Dashboard Panel -->
  <div id="admin-dashboard" class="card hidden" style="max-width: 850px;">
    <h2>👑 Admin Control Panel</h2>
    
    <!-- បញ្ជីបន្ទប់សកម្ម -->
    <div class="admin-panel" style="text-align: left;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🔴 បន្ទប់កំពុងដំណើរការ (Live Rooms)</h3>
        <button onclick="loadAdminRoomMonitor()" style="padding: 4px 10px; font-size: 12px;">🔄 Refresh</button>
      </div>
      <div id="activeRoomsList" style="margin-top: 8px;"></div>
    </div>

    <!-- តារាងគ្រប់គ្រង User ទាំងអស់ -->
    <div class="admin-panel" style="text-align: left; overflow-x: auto;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>👥 គ្រប់គ្រងសមាជិក (User Management)</h3>
        <button onclick="loadUsersTable()" style="padding: 4px 10px; font-size: 12px;">🔄 Refresh Users</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>បន្ទប់</th>
            <th>ស្ថានភាព</th>
            <th>សកម្មភាព</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>

    <!-- បង្កើត User ថ្មី -->
    <div class="admin-panel" style="text-align: left;">
      <h3>➕ បង្កើត User ថ្មី</h3>
      <input type="text" id="newUsername" placeholder="ឈ្មោះ User ថ្មី" />
      <input type="password" id="newPassword" placeholder="លេខសម្ងាត់ថ្មី" />
      <select id="userAssignedRoomSelect"></select>
      <button onclick="createNewUser()" class="btn-success" style="width: 100%;">បង្កើត User</button>
    </div>

    <!-- បង្កើតបន្ទប់ថ្មី -->
    <div class="admin-panel" style="text-align: left;">
      <h3>➕ បង្កើត បន្ទប់ថ្មី (Room)</h3>
      <input type="text" id="newRoomId" placeholder="ឈ្មោះបន្ទប់ថ្មី (ឧ. room-3)" />
      <button onclick="createNewRoom()" class="btn-warning" style="width: 100%;">បង្កើតបន្ទប់</button>
    </div>

    <button onclick="logoutAdmin()" class="btn-danger" style="width: 100%; margin-top: 20px;">ចាកចេញ (Logout)</button>
  </div>

  <!-- Room Container -->
  <div id="room-container" class="hidden">
    <h3 id="welcome-text"></h3>
    <div id="screenShareIndicator" style="display:none; color:#ffc107; margin-bottom:10px;">📺 កំពុងចែករំលែកអេក្រង់</div>
    <div class="controls">
      <button id="micBtn" onclick="toggleMic()" class="btn-success">🎤 បិទ/បើក មេក្រូ</button>
      <button id="screenBtn" onclick="shareScreen()" class="btn-warning">🖥️ Share Screen</button>
      <button onclick="leaveRoom()" class="btn-danger">🚪 ចាកចេញពីបន្ទប់</button>
    </div>
    <div class="video-grid">
      <div class="video-box">
        <p><strong>📹 អ្នក (You)</strong></p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div id="remoteVideos" style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
