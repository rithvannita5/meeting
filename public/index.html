<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធ Video Conference សុវត្ថិភាព</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; }
    .hidden { display: none !important; }

    /* Auth Box */
    .card { background: #1c2541; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: 100%; max-width: 420px; text-align: center; margin-top: 50px; }
    .card h2 { margin-bottom: 20px; color: #48cae4; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a506b; background: #0b132b; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #48cae4; }
    button { cursor: pointer; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 15px; transition: 0.2s; }
    .btn-primary { background: #00b4d8; color: #fff; width: 100%; }
    .btn-primary:hover { background: #0096c7; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }

    /* Room Layout */
    #room-container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; align-items: center; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .top-actions { display: flex; gap: 10px; }
    
    .section-title { font-size: 18px; margin: 15px 0 10px 0; color: #94a3b8; width: 100%; text-align: left; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    .grid-section { display: flex; flex-wrap: wrap; gap: 15px; width: 100%; justify-content: center; margin-bottom: 25px; }
    
    .video-box { position: relative; width: 340px; height: 240px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    .screen-box { width: 100%; max-width: 780px; height: 440px; border-color: #f59e0b; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .screen-box video { object-fit: contain; }

    .name-tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; z-index: 5; }
    .status-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 5; }
    
    /* Icon Control Buttons Over Local Video */
    .floating-controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; background: rgba(0,0,0,0.65); padding: 6px 14px; border-radius: 30px; }
    .float-btn { background: #334155; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; }
    .float-btn:hover { background: #475569; }
    .float-btn.off { background: #ef4444; }

    /* Admin Dashboard */
    #admin-dashboard { width: 100%; max-width: 1200px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: #1c2541; color: #fff; }
    .tab-btn.active { background: #00b4d8; }
    .tab-content { background: #1c2541; padding: 25px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0b132b; color: #48cae4; }
    .action-btn { padding: 6px 10px; font-size: 12px; margin-right: 4px; }
    .room-monitor-grid { display: flex; flex-wrap: wrap; gap: 15px; }
    .room-card { background: #0b132b; border: 1px solid #334155; padding: 15px; border-radius: 8px; width: 260px; }
    .room-card.live { border-color: #10b981; }
  </style>
</head>
<body>

  <!-- ផ្ទាំង Login -->
  <div id="auth" class="card">
    <h2>🚪 ចូលបន្ទប់ Meeting</h2>
    <div class="form-group">
      <label>ឈ្មោះគណនី (Username)</label>
      <input type="text" id="username" placeholder="ឧ. admin, rith...">
    </div>
    <div class="form-group">
      <label>លេខសម្ងាត់ (Password)</label>
      <input type="password" id="password" placeholder="បញ្ចូល Password">
    </div>
    <div class="form-group">
      <label>ជ្រើសរើសបន្ទប់</label>
      <select id="roomSelect"></select>
    </div>
    <button class="btn-primary" onclick="login()">ចូលរួមបន្ទប់</button>
  </div>

  <!-- ផ្ទាំង Admin Dashboard -->
  <div id="admin-dashboard" class="hidden">
    <div class="admin-header">
      <h2>🛠️ ផ្ទាំងបញ្ជាគ្រប់គ្រង (Admin Dashboard)</h2>
      <button class="btn-danger" onclick="logoutAdmin()">🚪 ចាកចេញ (Logout)</button>
    </div>
    <div class="nav-tabs">
      <button id="tabBtnRooms" class="tab-btn active" onclick="switchAdminTab('rooms')">📡 តាមដានបន្ទប់សកម្ម</button>
      <button id="tabBtnUsers" class="tab-btn" onclick="switchAdminTab('users')">👥 គ្រប់គ្រង Users</button>
      <button id="tabBtnNewRoom" class="tab-btn" onclick="switchAdminTab('newRoom')">➕ បង្កើតបន្ទប់ / User ថ្មី</button>
    </div>
    <div class="tab-content">
      <div id="tab-rooms" class="tab-pane active">
        <div id="activeRoomsList" class="room-monitor-grid"></div>
      </div>
      <div id="tab-users" class="tab-pane hidden">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>បន្ទប់កំណត់</th>
              <th>ស្ថានភាព</th>
              <th>សកម្មភាព</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
      <div id="tab-newRoom" class="tab-pane hidden">
        <div style="display:flex; gap:30px; flex-wrap:wrap;">
          <div style="flex:1; min-width:280px;">
            <h3>➕ បង្កើត User ថ្មី</h3>
            <div class="form-group" style="margin-top:10px;">
              <input type="text" id="newUsername" placeholder="Username">
            </div>
            <div class="form-group">
              <input type="password" id="newPassword" placeholder="Password">
            </div>
            <div class="form-group">
              <select id="userAssignedRoomSelect"></select>
            </div>
            <button class="btn-success" onclick="createNewUser()">បង្កើត User</button>
          </div>
          <div style="flex:1; min-width:280px;">
            <h3>➕ បង្កើតបន្ទប់ថ្មី</h3>
            <div class="form-group" style="margin-top:10px;">
              <input type="text" id="newRoomId" placeholder="ឧ. room-3">
            </div>
            <button class="btn-primary" onclick="createNewRoom()">បង្កើតបន្ទប់</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ផ្ទាំង Meeting Room -->
  <div id="room-container" class="hidden">
    <div class="header-bar">
      <h3 id="welcome-text">👋 សួស្តី...</h3>
      <div class="top-actions">
        <button id="screenBtn" class="btn-warning" onclick="toggleScreenShare()">🖥️ Share Screen</button>
        <button class="btn-secondary" onclick="changeMyPassword()">🔑 ប្តូរ Password</button>
        <button class="btn-danger" onclick="leaveRoom()">🚪 ចាកចេញពីបន្ទប់</button>
      </div>
    </div>

    <h4 class="section-title" id="screenTitle" style="display:none; color:#f59e0b;">🖥️ ផ្ទាំង Screen Share</h4>
    <div id="screenGrid" class="grid-section"></div>

    <h4 class="section-title" style="color:#10b981;">👤 ផ្ទាំង Camera & Participants</h4>
    <div id="videoGrid" class="grid-section">
      <!-- ផ្ទាំងកាមេរ៉ារបស់ខ្លួនឯង -->
      <div class="video-box" id="myVideoContainer">
        <div class="name-tag">👤 អ្នក (Me)</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <!-- Floating Mic / Camera Icons -->
        <div class="floating-controls">
          <button id="micBtnIcon" onclick="toggleMic()" class="float-btn" title="បិទ/បើក មេក្រូ">🎤</button>
          <button id="camBtnIcon" onclick="toggleCamera()" class="float-btn off" title="បិទ/បើក កាមេរ៉ា">🚫📹</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
