<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Screen Share App</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #18191a; color: white; padding: 20px; }
    
    .card { background: #242526; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: 95%; max-width: 450px; text-align: center; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #3a3b3c; border-radius: 6px; background: #3a3b3c; color: white; font-size: 15px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: bold; font-size: 14px; transition: 0.2s; }
    button:hover { background: #0056b3; }
    .hidden { display: none !important; }

    /* Admin Navigation Tabs */
    #admin-dashboard { width: 95%; max-width: 900px; text-align: left; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3b3c; padding-bottom: 15px; margin-bottom: 20px; }
    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .nav-tabs button { background: #3a3b3c; color: #b0b3b8; }
    .nav-tabs button.active { background: #007bff; color: white; }
    .tab-pane { display: none; background: #242526; padding: 20px; border-radius: 8px; }
    .tab-pane.active { display: block; }

    /* Table & Components */
    .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
    .room-card { background: #3a3b3c; padding: 15px; border-radius: 8px; border-left: 4px solid #007bff; }
    .room-card.live { border-left-color: #28a745; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid #3a3b3c; text-align: left; }
    th { background: #3a3b3c; color: #e4e6eb; }
    
    .action-btn { padding: 5px 10px; font-size: 12px; margin: 2px; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    .btn-warning { background: #ffc107; color: #000; }
    .btn-secondary { background: #6c757d; }

    /* Room Meeting View */
    #room-container { width: 95%; max-width: 1400px; text-align: center; }
    .controls { margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 15px; }
    .video-box { background: #242526; padding: 15px; border-radius: 12px; }
    video { width: 100%; height: 260px; background: #000; border-radius: 8px; object-fit: contain; cursor: pointer; border: 2px solid #3a3b3c; }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div id="auth" class="card">
    <h2 style="margin-bottom: 15px;">🔐 ចូលប្រើប្រាស់</h2>
    <input type="text" id="username" placeholder="ឈ្មោះគណនី (Username)" required />
    <input type="password" id="password" placeholder="លេខសម្ងាត់ (Password)" required />
    <label style="display:block; text-align:left; margin-top:8px; font-size:13px; color:#aaa;">ជ្រើសរើសបន្ទប់៖</label>
    <select id="roomSelect"></select>
    <button onclick="login()" style="width: 100%; margin-top: 15px;">ចូលរួមបន្ទប់</button>
  </div>

  <!-- Admin Dashboard Panel -->
  <div id="admin-dashboard" class="card hidden">
    <div class="admin-header">
      <h2>👑 ផ្ទាំងគ្រប់គ្រង Admin</h2>
      <button onclick="logoutAdmin()" class="btn-danger">🚪 ចាកចេញ</button>
    </div>

    <!-- Menu Bar Tabs -->
    <div class="nav-tabs">
      <button id="tabBtnRooms" class="active" onclick="switchAdminTab('rooms')">🚪 ១. បញ្ជីបន្ទប់</button>
      <button id="tabBtnUsers" onclick="switchAdminTab('users')">👥 ២. គ្រប់គ្រង User</button>
      <button id="tabBtnNewRoom" onclick="switchAdminTab('newRoom')">➕ ៣. បង្កើតបន្ទប់ថ្មី</button>
    </div>

    <!-- Tab 1: បញ្ជីបន្ទប់ និងចូល Join -->
    <div id="tab-rooms" class="tab-pane active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>🔴 បន្ទប់ទាំងអស់ និងបន្ទប់កំពុងដំណើរការ</h3>
        <button onclick="loadAdminRoomMonitor()" class="btn-secondary" style="font-size:12px;">🔄 Refresh</button>
      </div>
      <div id="activeRoomsList" class="room-grid"></div>
    </div>

    <!-- Tab 2: គ្រប់គ្រង User -->
    <div id="tab-users" class="tab-pane">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>👥 បញ្ជី និងបង្កើត User</h3>
      </div>
      
      <!-- Form បង្កើត User -->
      <div style="background:#18191a; padding:15px; border-radius:8px; margin-bottom:15px;">
        <h4 style="margin-bottom:8px;">➕ បន្ថែម User ថ្មី</h4>
        <input type="text" id="newUsername" placeholder="ឈ្មោះ User ថ្មី" />
        <input type="password" id="newPassword" placeholder="លេខសម្ងាត់ថ្មី" />
        <select id="userAssignedRoomSelect"></select>
        <button onclick="createNewUser()" class="btn-success" style="width: 100%; margin-top:6px;">បង្កើត User ថ្មី</button>
      </div>

      <!-- តារាង User -->
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>បន្ទប់</th>
              <th>ស្ថានភាព</th>
              <th>សកម្មភាព</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab 3: បង្កើតបន្ទប់ថ្មី -->
    <div id="tab-newRoom" class="tab-pane">
      <h3 style="margin-bottom:15px;">➕ បង្កើតបន្ទប់ប្រជុំថ្មី</h3>
      <div style="max-width:500px;">
        <input type="text" id="newRoomId" placeholder="ឧទាហរណ៍៖ room-3 ឬ Marketing-Room" />
        <button onclick="createNewRoom()" class="btn-warning" style="width: 100%; margin-top:10px;">រក្សាទុកបន្ទប់ថ្មី</button>
      </div>
    </div>
  </div>

  <!-- Room Container -->
  <div id="room-container" class="hidden">
    <h3 id="welcome-text" style="margin-bottom:15px;"></h3>
    <div id="screenShareIndicator" style="display:none; color:#ffc107; margin-bottom:10px;">📺 កំពុងចែករំលែកអេក្រង់</div>
    <div class="controls">
      <button id="micBtn" onclick="toggleMic()" class="btn-success">🎤 បិទ/បើក មេក្រូ</button>
      <button id="screenBtn" onclick="shareScreen()" class="btn-warning">🖥️ Share Screen</button>
      <button onclick="leaveRoom()" class="btn-danger">🚪 ចាកចេញ</button>
    </div>
    <div class="video-grid">
      <div class="video-box">
        <p style="margin-bottom:8px;"><strong>📹 អ្នក (You)</strong></p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div id="remoteVideos" style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
